<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>全局互動地圖 · 馬來西亞小旅行 2026.8.26–31</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
html,body{margin:0;height:100%;font-family:"PingFang TC","Noto Sans TC",-apple-system,sans-serif;color:#262E28;}
#map{position:absolute;top:0;left:0;right:0;bottom:0;}
.panel{position:absolute;top:12px;left:12px;z-index:1000;background:rgba(252,251,247,.96);border:1px solid #D9D8CD;border-radius:12px;padding:12px 14px;max-width:290px;font-size:13px;line-height:1.7;box-shadow:0 2px 10px rgba(0,0,0,.08);}
.panel h1{font-family:"Songti TC","Songti SC",Georgia,serif;font-size:17px;margin:0 0 4px;}
.panel .sub{color:#5C665E;font-size:12px;margin-bottom:8px;}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px;}
.jump button{font-size:12px;border:1px solid #D9D8CD;background:#fff;border-radius:999px;padding:2px 10px;cursor:pointer;color:#262E28;}
.jump button:hover{border-color:#1E6B57;color:#1E6B57;}
.leg label{display:flex;align-items:center;gap:8px;cursor:pointer;margin:2px 0;}
.leg input{margin:0;}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;}
.sq{display:inline-block;width:11px;height:11px;border-radius:2px;}
.lbl{background:rgba(252,251,247,.92);border:none;border-radius:4px;padding:1px 5px;font-size:11px;color:#26312B;box-shadow:0 0 0 1px rgba(0,0,0,.08);font-family:"PingFang TC",sans-serif;white-space:nowrap;}
.leaflet-popup-content{font-size:13px;line-height:1.6;}
.leaflet-popup-content b{font-size:14px;}
.foot{position:absolute;bottom:14px;left:12px;z-index:1000;background:rgba(252,251,247,.9);border-radius:8px;padding:4px 10px;font-size:11px;color:#5C665E;max-width:60vw;}
.panel.min .sub,.panel.min .jump,.panel.min .leg{display:none;}
@media (max-width:640px){.panel{max-width:78vw;font-size:12px;} .foot{display:none;}}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h1>馬來西亞小旅行 · 全局圖 <button id="tog" style="float:right;font-size:11px;border:1px solid #D9D8CD;background:#fff;border-radius:999px;padding:1px 8px;cursor:pointer;">收合</button></h1>
  <div class="sub">2026.8.26–31 · 一張圖看所有已規劃的點。滾輪縮放、拖曳平移；拉近到街區才顯示名稱；點圖釘看一句話。</div>
  <div class="jump">
    <button onclick="go('my')">全馬三城</button>
    <button onclick="go('kl')">吉隆坡三圈</button>
    <button onclick="go('base')">住處步行圈</button>
    <button onclick="go('cs')">茨廠街菱形</button>
    <button onclick="go('ipoh')">怡保老城</button>
  </div>
  <div class="leg" id="leg"></div>
</div>
<div class="foot">座標：OpenStreetMap／Nominatim 逐點查證（8/14）；標「估」者為街廓級定位，圖釘彈窗一律用店名開 Google Maps。底圖 © OpenStreetMap／CARTO；衛星 © Esri。</div>

var light=L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'© OpenStreetMap © CARTO',maxZoom:19});
var streets=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19});
var sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'© Esri',maxZoom:19});
var map=L.map('map',{layers:[light],zoomControl:false}).setView([3.15,101.70],13);
L.control.zoom({position:'topright'}).addTo(map);
L.control.layers({'淡色':light,'街道':streets,'衛星':sat},null,{position:'topright'}).addTo(map);
L.control.scale({imperial:false,position:'bottomright'}).addTo(map);

var CAT={
 base:{name:'住處與交通',color:'#A65B2B'},
 star:{name:'米其林星級（★＝已訂）',color:'#7A1F1F'},
 food:{name:'娘惹・老字號・local',color:'#1E6B57'},
 cafe:{name:'咖啡與甜',color:'#4A6478'},
 art:{name:'藝廊・書店・文青點',color:'#7F58A8'},
 shop:{name:'選物與工藝',color:'#BA7517'},
 ipoh:{name:'怡保（8/27 一日）',color:'#0F6E56'}
};
var groups={}; Object.keys(CAT).forEach(function(k){groups[k]=L.layerGroup().addTo(map);});

function add(cat,lat,lng,name,note,q,opts){
  opts=opts||{};
  var c=CAT[cat].color;
  var mk=L.circleMarker([lat,lng],{radius:opts.big?9:6.5,color:c,fillColor:c,fillOpacity:.92,weight:opts.big?3:1.5}).addTo(groups[cat]);
  mk.bindPopup('<b>'+name+'</b><br>'+note+'<br><a target="_blank" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q||name)+'">在 Google Maps 開導航</a>');
  mk.bindTooltip(name,{permanent:opts.label!==false,direction:opts.dir||'right',offset:[8,0],className:'lbl'});
  mk._cat=cat; return mk;
}

L.circle([3.1610013,101.7125631],{radius:400,color:'#A65B2B',weight:1.2,dashArray:'5 5',fill:false}).addTo(rings);

/* 圖例 */
var leg=document.getElementById('leg');
Object.keys(CAT).forEach(function(k){
  var l=document.createElement('label');
  l.innerHTML='<input type="checkbox" checked data-k="'+k+'"><span class="dot" style="background:'+CAT[k].color+'"></span>'+CAT[k].name;
  leg.appendChild(l);
});
var lr=document.createElement('label'); lr.innerHTML='<input type="checkbox" checked data-k="rings"><span class="sq" style="border:1.5px dashed #888;"></span>步行圈・菱形・鐵路'; leg.appendChild(lr);
leg.addEventListener('change',function(e){var k=e.target.getAttribute('data-k'); var g=(k==='rings')?rings:groups[k]; if(e.target.checked)map.addLayer(g); else map.removeLayer(g);});

/* 跳轉 */
var VIEWS={my:[[3.85,101.4],9],kl:[[3.150,101.703],14],base:[[3.1585,101.7135],16],cs:[[3.1450,101.6968],16],ipoh:[[4.5955,101.0795],16]};
function go(k){map.setView(VIEWS[k][0],VIEWS[k][1]);}
function syncLabels(){var z=map.getZoom(); document.querySelectorAll('.lbl').forEach(function(el){el.style.display=(z>=15)?'':'none';});}
map.on('zoomend',syncLabels); syncLabels();
document.getElementById('tog').addEventListener('click',function(){var p=document.querySelector('.panel'); p.classList.toggle('min'); this.textContent=p.classList.contains('min')?'展開':'收合';});
